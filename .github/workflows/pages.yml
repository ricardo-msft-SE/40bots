name: Deploy proposal site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install browser build dependencies
        run: npm ci

      - name: Install API test dependencies
        run: npm ci --prefix api

      - name: Test
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Install Chromium for game checks
        run: npx playwright install --with-deps chromium

      - name: Check presentation game in Chromium
        run: npm run test:browser

      - name: Verify deployment package boundaries
        run: |
          npm run build:api
          npm run test:packages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
